backend:
  name: git-gateway
  branch: main 

media_folder: "images"
public_folder: "images"

collections:
  - name: "donnees_site"
    label: "Gestion du Blog"
    files:
      - label: "Mes Comptes-Rendus"
        name: "articles"
        file: "articles.json"
        fields:
          - label: "Articles"
            name: "liste_articles"
            widget: "list"
            fields:
              - {label: "ID de l'article", name: "id", widget: "string"}
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Résumé", name: "resume", widget: "text"}
              - {label: "Lien Strava", name: "lien_strava", widget: "string", required: false}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Contenu (HTML)", name: "contenu", widget: "text"}

      - label: "Mes Courses"
        name: "courses"
        file: "courses.json"
        fields:
          - label: "Courses"
            name: "liste_courses"
            widget: "list"
            fields:
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Nom de la course", name: "nom", widget: "string"}
              - {label: "Distance (km)", name: "distance", widget: "number", value_type: "float"}
              - {label: "Dénivelé (m)", name: "denivele", widget: "number"}
              - {label: "Chrono", name: "chrono", widget: "string"}
              - label: "Article Lié"
                name: "article"
                widget: "relation"
                collection: "donnees_site"
                file: "articles"
                search_fields: ["liste_articles.*.titre"]
                display_fields: ["liste_articles.*.titre"]
                value_field: "liste_articles.*.id"
                required: false

    - name: "entrainement"
    label: "Entraînement"
    files:
      - label: "Semaines d'entraînement"
        name: "semaines"
        file: "entrainements.json"
        format: "json"
        fields:
          - label: "Liste des semaines"
            name: "liste_semaines"
            widget: "list"
            fields:
              - {label: "Nom de la semaine (ex: S1 - Reprise)", name: "titre", widget: "string"}
              - {label: "Dates (ex: 01/09 - 07/09)", name: "dates", widget: "string"}
              - {label: "Total KM de la semaine", name: "total_km", widget: "number", value_type: "float"}
              
              - {label: "Lundi (Type)", name: "lundi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Lundi (Détail + KM)", name: "lundi_detail", widget: "string", required: false}
              
              - {label: "Mardi (Type)", name: "mardi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Mardi (Détail + KM)", name: "mardi_detail", widget: "string", required: false}
              
              - {label: "Mercredi (Type)", name: "mercredi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Mercredi (Détail + KM)", name: "mercredi_detail", widget: "string", required: false}
              
              - {label: "Jeudi (Type)", name: "jeudi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Jeudi (Détail + KM)", name: "jeudi_detail", widget: "string", required: false}
              
              - {label: "Vendredi (Type)", name: "vendredi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Vendredi (Détail + KM)", name: "vendredi_detail", widget: "string", required: false}
              
              - {label: "Samedi (Type)", name: "samedi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Samedi (Détail + KM)", name: "samedi_detail", widget: "string", required: false}
              
              - {label: "Dimanche (Type)", name: "dimanche_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Fractionné", "Course", "Vélo/Croisé"]}
              - {label: "Dimanche (Détail + KM)", name: "dimanche_detail", widget: "string", required: false}
