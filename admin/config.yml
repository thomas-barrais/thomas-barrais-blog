backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "donnees_site"
    label: "Gestion du Blog"
    files:
      - label: "Mes Comptes-Rendus"
        name: "articles"
        file: "articles.json"
        fields:
          - label: "Articles"
            name: "liste_articles"
            widget: "list"
            fields:
              - {label: "ID de l'article", name: "id", widget: "string"}
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Résumé", name: "resume", widget: "text"}
              - {label: "Lien Strava", name: "lien_strava", widget: "string", required: false}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Contenu (HTML)", name: "contenu", widget: "text"}

      - label: "Mes Courses"
        name: "courses"
        file: "courses.json"
        fields:
          - label: "Courses"
            name: "liste_courses"
            widget: "list"
            fields:
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Nom de la course", name: "nom", widget: "string"}
              - {label: "Distance (km)", name: "distance", widget: "number", value_type: "float"}
              - {label: "Dénivelé (m)", name: "denivele", widget: "number"}
              - {label: "Chrono", name: "chrono", widget: "string"}
              - label: "Article Lié"
                name: "article"
                widget: "relation"
                collection: "donnees_site"
                file: "articles"
                search_fields: ["liste_articles.*.titre"]
                display_fields: ["liste_articles.*.titre"]
                value_field: "liste_articles.*.id"
                required: false

  - name: "entrainement"
    label: "Entraînement"
    files:
      - label: "Mes Préparations"
        name: "preparations"
        file: "entrainements.json"
        format: "json"
        fields:
          - label: "Liste des Préparations"
            name: "liste_prepas"
            widget: "list"
            fields:
              - {label: "Nom de l'objectif", name: "nom_prepa", widget: "string"}
              - {label: "Année", name: "annee", widget: "string"}
              
              - label: "Semaines d'entraînement"
                name: "liste_semaines"
                widget: "list"
                fields:
                  - {label: "Nom (ex: S1)", name: "titre", widget: "string"}
                  - {label: "Dates", name: "dates", widget: "string"}
                  - {label: "Total KM", name: "total_km", widget: "number", value_type: "float"}
                  
                  - {label: "Lundi S1 (Type)", name: "lundi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
                  - {label: "Lundi S1 (Titre)", name: "lundi_titre", widget: "string", required: false}
                  - {label: "Lundi S1 (KM)", name: "lundi_km", widget: "number", value_type: "float", required: false}
                  - {label: "Lundi S2 (Type)", name: "lundi_type_2", widget: "select", options: ["Aucun", "Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Aucun", required: false}
                  - {label: "Lundi S2 (Titre)", name: "lundi_titre_2", widget: "string", required: false}
                  - {label: "Lundi S2 (KM)", name: "lundi_km_2", widget: "number", value_type: "float", required: false}
                  
                  - {label: "Mardi S1 (Type)", name: "mardi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
                  - {label: "Mardi S1 (Titre)", name: "mardi_titre", widget: "string", required: false}
                  - {label: "Mardi S1 (KM)", name: "mardi_km", widget: "number", value_type: "float", required: false}
                  - {label: "Mardi S2 (Type)", name: "mardi_type_2", widget: "select", options: ["Aucun", "Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Aucun", required: false}
                  - {label: "Mardi S2 (Titre)", name: "mardi_titre_2", widget: "string", required: false}
                  - {label: "Mardi S2 (KM)", name: "mardi_km_2", widget: "number", value_type: "float", required: false}
                  
                  - {label: "Mercredi S1 (Type)", name: "mercredi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
                  - {label: "Mercredi S1 (Titre)", name: "mercredi_titre", widget: "string", required: false}
