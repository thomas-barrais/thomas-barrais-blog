                  - {label: "Jeudi S2 (Titre)", name: "jeudi_titre_2", widget: "string", required: false}
                  - {label: "Jeudi S2 (KM)", name: "jeudi_km_2", widget: "number", value_type: "float", required: false}
                  
                  - {label: "Vendredi S1 (Type)", name: "vendredi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
