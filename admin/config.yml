                  - {label: "Vendredi S2 (KM)", name: "vendredi_km_2", widget: "number", value_type: "float", required: false}
                  
                  - {label: "Samedi S1 (Type)", name: "samedi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
                  - {label: "Samedi S1 (Titre)", name: "samedi_titre", widget: "string", required: false}
                  - {label: "Samedi S1 (KM)", name: "samedi_km", widget: "number", value_type: "float", required: false}
