                  - {label: "Dimanche S1 (Type)", name: "dimanche_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
                  - {label: "Dimanche S1 (Titre)", name: "dimanche_titre", widget: "string", required: false}
                  - {label: "Dimanche S1 (KM)", name: "dimanche_km", widget: "number", value_type: "float", required: false}
                  - {label: "Dimanche S2 (Type)", name: "dimanche_type_2", widget: "select", options: ["Aucun", "Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Aucun", required: false}
                  - {label: "Dimanche S2 (Titre)", name: "dimanche_titre_2", widget: "string", required: false}
