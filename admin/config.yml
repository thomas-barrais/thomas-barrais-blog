                  - {label: "Mercredi S2 (KM)", name: "mercredi_km_2", widget: "number", value_type: "float", required: false}
                  
                  - {label: "Jeudi S1 (Type)", name: "jeudi_type", widget: "select", options: ["Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Repos"}
                  - {label: "Jeudi S1 (Titre)", name: "jeudi_titre", widget: "string", required: false}
