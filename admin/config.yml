                  - {label: "Mercredi S2 (Type)", name: "mercredi_type_2", widget: "select", options: ["Aucun", "Repos", "Endurance", "Tempo", "Intervalles", "SL", "SL Allure", "Renfo", "Course", "Vélo", "Marche", "Natation", "Trail"], default: "Aucun", required: false}
